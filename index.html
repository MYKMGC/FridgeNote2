<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FridgeNote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --danger: #ef4444;
      --warn-bg: #fef9c3;
      --warn-border: #facc15;
      --danger-bg: #fee2e2;
      --danger-border: #f87171;
      --card-bg: #ffffff;
      --surface: #f1f5f9;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    html, body {
      height: 100%;
      background: var(--surface);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar (sticky wrapper) ── */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .logo { font-size: 22px; }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    header .count {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--surface);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── Toolbar ── */
    .toolbar {
      border-bottom: 1px solid var(--border);
    }
    .filter-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s, border-color .15s;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .sort-bar {
      padding: 6px 16px 10px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-sort {
      height: 30px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn-sort.asc  { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
    .btn-sort.desc { border-color: #8b5cf6;        color: #7c3aed;        background: #f5f3ff; }

    /* ── List ── */
    #list {
      padding: 16px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Empty state ── */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px 24px;
      color: var(--text-muted);
      text-align: center;
    }
    #empty .empty-icon { font-size: 56px; opacity: .5; }
    #empty p { font-size: 15px; line-height: 1.5; }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: transform .12s;
    }
    .card:active { transform: scale(.98); }
    .card.warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }
    .card.danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .card-icon {
      font-size: 28px;
      flex-shrink: 0;
      line-height: 1;
      margin-top: 1px;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-qty {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-delete {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s;
    }
    .btn-delete:active { background: var(--danger-bg); color: var(--danger); }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-category {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #0369a1;
      letter-spacing: .2px;
    }
    .expiry-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card.warn .expiry-label { color: #92400e; }
    .card.danger .expiry-label { color: #b91c1c; }
    .expiry-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
    }
    .card.warn .expiry-badge { background: #fde68a; color: #78350f; }
    .card.danger .expiry-badge { background: #fca5a5; color: #7f1d1d; }

    /* ── FAB ── */
    #fab {
      position: fixed;
      bottom: 28px;
      right: 20px;
      z-index: 20;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59,130,246,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, transform .12s;
    }
    #fab:active { background: var(--primary-dark); transform: scale(.92); }

    /* ── Modal overlay ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Modal sheet ── */
    #modal {
      background: #fff;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      transform: translateY(100%);
      transition: transform .25s cubic-bezier(.32,0,.67,0);
    }
    #modal-overlay.open #modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: #cbd5e1;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
    }

    /* ── Form ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }
    .field label .req { color: var(--danger); margin-left: 2px; }
    .field input,
    .field select {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 16px;
      color: var(--text);
      background: #fff;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus,
    .field select:focus { border-color: var(--primary); }
    /* ── Step visibility ── */
    .step { display: flex; flex-direction: column; }
    .step.hidden { display: none; }

    /* ── Category grid (step 1) ── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 6px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, border-color .15s;
    }
    .cat-btn:active { background: #eff6ff; border-color: var(--primary); }
    .cat-btn-icon  { font-size: 26px; line-height: 1; }
    .cat-btn-label { font-size: 11px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.3; }

    /* ── Step 2 header ── */
    .step2-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn-back {
      border: none;
      background: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 2px;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .step2-cat-name { font-size: 16px; font-weight: 700; }

    /* ── Item grid (step 2) ── */
    .item-grid-wrap {
      max-height: 190px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .item-btn {
      padding: 9px 4px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      -webkit-tap-highlight-color: transparent;
      transition: background .12s, border-color .12s, color .12s;
    }
    .item-btn.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ── Modal actions ── */
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    .btn {
      flex: 1;
      height: 52px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { opacity: .8; transform: scale(.97); }
    .btn-cancel {
      background: var(--surface);
      color: var(--text-muted);
    }
    .btn-add {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59,130,246,.35);
    }
  </style>
</head>
<body>

<div id="topbar">
  <header>
    <span class="logo">🧊</span>
    <h1>FridgeNote</h1>
    <span class="count" id="count">0 件</span>
  </header>
  <div class="toolbar">
    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" data-cat="すべて">すべて</button>
      <button class="filter-btn" data-cat="肉類">🥩 肉類</button>
      <button class="filter-btn" data-cat="野菜・果実類">🥦 野菜</button>
      <button class="filter-btn" data-cat="魚介類">🐟 魚介</button>
      <button class="filter-btn" data-cat="乾物・海藻類">🌿 乾物</button>
      <button class="filter-btn" data-cat="きのこ・山菜類">🍄 きのこ</button>
      <button class="filter-btn" data-cat="卵類">🥚 卵</button>
      <button class="filter-btn" data-cat="いも類">🥔 いも</button>
      <button class="filter-btn" data-cat="パン類">🍞 パン</button>
      <button class="filter-btn" data-cat="ごはん類">🍚 ごはん</button>
      <button class="filter-btn" data-cat="乳製品類">🧀 乳製品</button>
      <button class="filter-btn" data-cat="豆・豆腐類">🫘 豆腐</button>
      <button class="filter-btn" data-cat="麺類">🍜 麺</button>
    </div>
    <div class="sort-bar">
      <button class="btn-sort asc" id="btn-sort">📅 賞味期限が近い順 ↑</button>
    </div>
  </div>
</div>

<main id="list"></main>

<button id="fab" aria-label="食材を追加">＋</button>

<div id="modal-overlay" role="dialog" aria-modal="true">
  <div id="modal">
    <div class="modal-handle"></div>

    <!-- Step 1: カテゴリ選択 -->
    <div id="step-cat" class="step">
      <p class="modal-title">カテゴリを選択</p>
      <div class="cat-grid" id="cat-grid"></div>
      <button type="button" class="btn btn-cancel" id="btn-cancel-cat">キャンセル</button>
    </div>

    <!-- Step 2: 食材選択 + 入力フォーム -->
    <div id="step-item" class="step hidden">
      <div class="step2-header">
        <button type="button" class="btn-back" id="btn-back">← 戻る</button>
        <span class="step2-cat-name" id="step2-cat-name"></span>
      </div>
      <div class="item-grid-wrap">
        <div class="item-grid" id="item-grid"></div>
      </div>
      <form id="add-form" novalidate>
        <div class="field">
          <label for="f-name">食材名<span class="req">*</span></label>
          <input id="f-name" type="text" placeholder="上から選ぶか直接入力" autocomplete="off" inputmode="text" />
        </div>
        <div class="field">
          <label for="f-exp">賞味期限<span class="req">*</span></label>
          <input id="f-exp" type="date" />
        </div>
        <div class="field">
          <label for="f-qty">数量メモ（任意）</label>
          <input id="f-qty" type="text" placeholder="例: 2本、少量" autocomplete="off" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" id="btn-cancel">キャンセル</button>
          <button type="submit" class="btn btn-add">追加する</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'fridgenote_items';
  const CATEGORY_ICON = {
    '肉類':       '🥩',
    '野菜・果実類': '🥦',
    '魚介類':     '🐟',
    '乾物・海藻類': '🌿',
    'きのこ・山菜類': '🍄',
    '卵類':       '🥚',
    'いも類':     '🥔',
    'パン類':     '🍞',
    'ごはん類':   '🍚',
    '乳製品類':   '🧀',
    '豆・豆腐類': '🫘',
    '麺類':       '🍜',
  };

  const FOOD_ITEMS = {
    '肉類':       ['牛薄切り肉','牛焼肉用','牛ステーキ用','牛ブロック肉','豚薄切り肉','豚焼肉用','豚生姜焼き用肉','豚ブロック肉','鶏もも肉','鶏むね肉','挽き肉','ハム・ソーセージ・ベーコン類'],
    '野菜・果実類': ['キャベツ','レタス類','白菜','たまねぎ','長ねぎ','もやし','トマト','きゅうり','なす','ピーマン類','かぼちゃ','にんじん','大根','生姜','カット野菜','果実類'],
    '魚介類':     ['さけ・サーモン','ぶり','さば','さんま','しらす','ツナ缶','エビ・カニ','イカ・タコ','貝類','魚卵','練り物'],
    '乾物・海藻類': ['海苔','昆布','わかめ','麩','春雨'],
    'きのこ・山菜類': ['しいたけ','しめじ','エリンギ','えのきたけ','まいたけ'],
    '卵類':       ['鶏卵'],
    'いも類':     ['じゃがいも','さつまいも','里芋','長芋・山芋','こんにゃく類'],
    'パン類':     ['食パン','フランスパン'],
    'ごはん類':   ['ごはん','米（炊飯前）','もち米','餅'],
    '乳製品類':   ['牛乳','チーズ','ヨーグルト','生クリーム'],
    '豆・豆腐類': ['豆腐','油揚げ','厚揚げ','納豆'],
    '麺類':       ['うどん','そば','そうめん','中華麺','パスタ・スパゲティ'],
  };

  let currentFilter = 'すべて';
  let sortAsc = true;

  function loadItems() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function daysDiff(dateStr) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const exp = new Date(dateStr + 'T00:00:00');
    return Math.round((exp - today) / 86400000);
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function expiryStatus(dateStr) {
    const diff = daysDiff(dateStr);
    if (diff < 0)  return { cls: 'danger', badge: '期限切れ' };
    if (diff === 0) return { cls: 'danger', badge: '今日まで' };
    if (diff <= 3)  return { cls: 'warn',   badge: `あと${diff}日` };
    return { cls: '', badge: '' };
  }

  function renderList() {
    const allItems = loadItems();
    const items = currentFilter === 'すべて'
      ? allItems
      : allItems.filter(i => i.category === currentFilter);
    const list  = document.getElementById('list');
    const count = document.getElementById('count');
    count.textContent = currentFilter === 'すべて'
      ? `${allItems.length} 件`
      : `${items.length} / ${allItems.length} 件`;

    if (items.length === 0) {
      const msg = allItems.length === 0
        ? '登録された食材はありません。<br>右下の ＋ ボタンで追加してみましょう！'
        : `「${currentFilter}」の食材はありません。`;
      list.innerHTML = `
        <div id="empty">
          <div class="empty-icon">🧊</div>
          <p>${msg}</p>
        </div>`;
      return;
    }

    const sorted = [...items].sort((a, b) => {
      const da = daysDiff(a.expiry), db = daysDiff(b.expiry);
      return sortAsc ? da - db : db - da;
    });

    list.innerHTML = sorted.map(item => {
      const { cls, badge } = expiryStatus(item.expiry);
      const icon = CATEGORY_ICON[item.category] || '📦';
      const badgeHtml = badge
        ? `<span class="expiry-badge">${badge}</span>`
        : '';
      const qtyHtml = item.qty
        ? `<div class="card-qty">${escHtml(item.qty)}</div>`
        : '';
      return `
        <div class="card ${cls}" data-id="${item.id}">
          <div class="card-top">
            <div class="card-icon">${icon}</div>
            <div class="card-body">
              <div class="card-name">${escHtml(item.name)}</div>
              ${qtyHtml}
            </div>
            <button class="btn-delete" data-id="${item.id}" aria-label="削除">✕</button>
          </div>
          <div class="card-footer">
            <span class="badge-category">${escHtml(item.category)}</span>
            <span class="expiry-label">📅 ${formatDate(item.expiry)}${badgeHtml}</span>
          </div>
        </div>`;
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Filter ──
  document.getElementById('filter-row').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderList();
  });

  // ── Sort ──
  document.getElementById('btn-sort').addEventListener('click', () => {
    sortAsc = !sortAsc;
    const btn = document.getElementById('btn-sort');
    btn.className = `btn-sort ${sortAsc ? 'asc' : 'desc'}`;
    btn.textContent = sortAsc ? '📅 賞味期限が近い順 ↑' : '📅 賞味期限が遠い順 ↓';
    renderList();
  });

  // ── Delete ──
  document.getElementById('list').addEventListener('click', e => {
    const btn = e.target.closest('.btn-delete');
    if (!btn) return;
    const id = btn.dataset.id;
    const items = loadItems().filter(i => i.id !== id);
    saveItems(items);
    renderList();
  });

  // ── Modal ──
  const overlay   = document.getElementById('modal-overlay');
  const stepCat   = document.getElementById('step-cat');
  const stepItem  = document.getElementById('step-item');
  const form      = document.getElementById('add-form');
  const fName     = document.getElementById('f-name');
  const fExp      = document.getElementById('f-exp');
  const fQty      = document.getElementById('f-qty');
  let selectedCategory = '';

  function buildCatGrid() {
    document.getElementById('cat-grid').innerHTML =
      Object.entries(CATEGORY_ICON).map(([cat, icon]) =>
        `<button type="button" class="cat-btn" data-cat="${escHtml(cat)}">
           <span class="cat-btn-icon">${icon}</span>
           <span class="cat-btn-label">${escHtml(cat)}</span>
         </button>`
      ).join('');
  }

  function showStep(n) {
    stepCat.classList.toggle('hidden', n !== 1);
    stepItem.classList.toggle('hidden', n !== 2);
    document.getElementById('modal').scrollTop = 0;
  }

  function openCategory(cat) {
    selectedCategory = cat;
    document.getElementById('step2-cat-name').textContent =
      `${CATEGORY_ICON[cat] || ''} ${cat}`;
    fName.value = '';
    document.getElementById('item-grid').innerHTML =
      (FOOD_ITEMS[cat] || []).map(item =>
        `<button type="button" class="item-btn" data-item="${escHtml(item)}">${escHtml(item)}</button>`
      ).join('');
    showStep(2);
  }

  function openModal() {
    fName.value = '';
    fExp.value  = '';
    fQty.value  = '';
    selectedCategory = '';
    buildCatGrid();
    showStep(1);
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  // Category grid click (event delegation)
  document.getElementById('cat-grid').addEventListener('click', e => {
    const btn = e.target.closest('.cat-btn');
    if (btn) openCategory(btn.dataset.cat);
  });

  // Item grid click (event delegation)
  document.getElementById('item-grid').addEventListener('click', e => {
    const btn = e.target.closest('.item-btn');
    if (!btn) return;
    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    fName.value = btn.dataset.item;
  });

  document.getElementById('btn-back').addEventListener('click', () => showStep(1));
  document.getElementById('btn-cancel-cat').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('fab').addEventListener('click', openModal);

  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal();
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = fName.value.trim();
    const exp  = fExp.value;
    if (!name) { fName.focus(); return; }
    if (!exp)  { fExp.focus();  return; }
    const items = loadItems();
    items.push({
      id:       Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      category: selectedCategory,
      expiry:   exp,
      qty:      fQty.value.trim()
    });
    saveItems(items);
    renderList();
    closeModal();
  });

  // Initial render
  renderList();
</script>
</body>
</html>
